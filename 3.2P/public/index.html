<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Box | SIT725 3.2P</title>

  <!-- Materialize CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav>
    <div class="nav-wrapper teal darken-2">
      <a href="#" class="brand-logo center">Recipe Box</a>
    </div>
  </nav>

  <div class="container" style="margin-top: 30px;">
    <h4 class="center-align">Today's Recipes</h4>
    <p class="center-align grey-text text-darken-1">
      Pulled live from the server's <code>/api/recipes</code> endpoint.
    </p>

    <div id="recipe-cards" class="row" style="margin-top: 20px;">
      <!-- Cards are inserted here by app.js -->
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
